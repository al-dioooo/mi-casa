<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Casa</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,400&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1B1A3A;
    --night-2:#27265A;
    --ink:#F1E9DA;
    --ink-dim:#AFA8C4;
    --paper:#F7E3CF;
    --paper-2:#E8CBA8;
    --paper-ink:#2A2140;
    --wax:#B8323C;
    --wax-2:#7E1C25;
    --amber:#F2B441;
    --pink:#F5A3B7;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --pixel:'Press Start 2P',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--night);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  body{min-height:100dvh;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  a{color:var(--pink)}
  p{margin:0 0 1.1em}

  /* screens */
  .screen{display:none;min-height:100dvh;padding:40px 22px 64px;max-width:520px;margin:0 auto;flex-direction:column}
  .screen.on{display:flex;animation:fade .5s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  h1{font-family:var(--serif);font-weight:300;font-size:clamp(34px,9vw,44px);line-height:1.05;letter-spacing:-.01em;margin:0 0 .5em}
  h2{font-family:var(--pixel);font-weight:400;font-size:13px;line-height:1.8;color:var(--amber);margin:0 0 26px}
  .lede{font-size:19px;line-height:1.55;font-weight:300}
  .lede i{font-weight:400}

  .btn{display:inline-block;font-family:var(--pixel);font-size:11px;line-height:1;padding:16px 20px;border:3px solid var(--amber);color:var(--amber);border-radius:3px;box-shadow:4px 4px 0 var(--wax-2);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--wax-2)}
  .quiet{font-family:var(--pixel);font-size:9px;line-height:1.9;color:var(--ink-dim);background:none;text-decoration:none}
  .quiet:hover{color:var(--ink)}
  .foot{margin-top:auto;padding-top:44px;text-align:center}

  /* ─── envelope ─── */
  .env-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center}
  .envelope{position:relative;width:min(88vw,340px);aspect-ratio:1.5;border-radius:5px;background:var(--paper);box-shadow:0 34px 60px -24px rgba(0,0,0,.7);cursor:pointer;-webkit-user-select:none;user-select:none}
  .envelope .fold{position:absolute;inset:0;border-radius:5px;overflow:hidden}
  .envelope .fold::before,.envelope .fold::after{content:"";position:absolute;bottom:0;width:50%;height:100%;background:var(--paper-2);opacity:.55}
  .envelope .fold::before{left:0;clip-path:polygon(0 0,100% 100%,0 100%)}
  .envelope .fold::after{right:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
  .envelope .flap{position:absolute;left:0;top:0;width:100%;height:58%;background:linear-gradient(180deg,var(--paper-2),#dcbb95);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .9s cubic-bezier(.65,0,.2,1);z-index:2;box-shadow:0 2px 3px rgba(0,0,0,.08)}
  .envelope.open .flap{transform:rotateX(180deg)}
  .envelope .to{position:absolute;left:18px;bottom:16px;font-style:italic;font-weight:300;font-size:17px;color:var(--paper-ink);opacity:.8;z-index:1}
  .stamp{position:absolute;right:14px;top:12px;width:44px;height:52px;background:var(--pink);border:3px dashed var(--paper);outline:1px solid var(--paper-2);display:grid;place-items:center;z-index:1;opacity:.95}
  .seal{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#DB5A63,var(--wax) 52%,var(--wax-2));box-shadow:0 5px 12px rgba(0,0,0,.4),inset 0 0 0 5px rgba(255,255,255,.07);display:grid;place-items:center;font-weight:500;font-size:30px;color:#F7D6C4;z-index:3;transition:transform .5s,opacity .5s}
  .envelope.unlocked .seal{animation:breathe 2.4s ease-in-out infinite}
  .envelope.open .seal{transform:translate(-50%,-50%) scale(.4);opacity:0}
  @keyframes breathe{0%,100%{box-shadow:0 5px 12px rgba(0,0,0,.4),inset 0 0 0 5px rgba(255,255,255,.07),0 0 0 0 rgba(242,180,65,.55)}50%{box-shadow:0 5px 12px rgba(0,0,0,.4),inset 0 0 0 5px rgba(255,255,255,.07),0 0 0 18px rgba(242,180,65,0)}}
  .count{font-family:var(--pixel);font-size:14px;line-height:2;color:var(--amber);min-height:56px}
  .count small{display:block;font-family:var(--serif);font-style:italic;font-weight:300;font-size:17px;color:var(--ink-dim);letter-spacing:0}

  /* ─── greeting ─── */
  .photos{margin:34px 0 10px;display:flex;flex-direction:column;gap:26px}
  figure{margin:0}
  figure img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;background:var(--night-2);box-shadow:0 20px 40px -20px rgba(0,0,0,.7)}
  figure.missing img{display:none}
  figure.missing::before{content:attr(data-file) " goes here";display:grid;place-items:center;aspect-ratio:4/5;border:2px dashed var(--ink-dim);border-radius:4px;font-family:var(--pixel);font-size:9px;line-height:1.8;color:var(--ink-dim);text-align:center;padding:20px}
  figcaption{margin-top:12px;font-style:italic;font-weight:300;font-size:17px;line-height:1.45;color:var(--ink)}

  /* ─── lock ─── */
  .lock-form{display:flex;flex-direction:column;gap:16px;margin-top:8px}
  .lock-form input{font-family:var(--pixel);font-size:16px;letter-spacing:.2em;padding:18px 16px;background:var(--night-2);color:var(--ink);border:3px solid var(--amber);border-radius:3px;width:100%;text-align:center}
  .lock-form input::placeholder{color:var(--ink-dim);letter-spacing:.05em}
  .err{font-style:italic;font-weight:300;color:var(--pink);min-height:1.4em;text-align:center}
  .shake{animation:shake .4s}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  /* ─── save slots ─── */
  .slots{display:flex;flex-direction:column;gap:14px}
  .slot{text-align:left;width:100%;border:3px solid var(--amber);border-radius:3px;padding:16px 16px 16px 18px;background:var(--night-2);box-shadow:4px 4px 0 var(--wax-2);display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:start;transition:transform .08s,box-shadow .08s}
  .slot:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--wax-2)}
  .slot .n{font-family:var(--pixel);font-size:9px;line-height:1.8;color:var(--amber);padding-top:2px}
  .slot .body{font-size:17px;line-height:1.5;font-weight:300;color:var(--ink-dim);font-style:italic}
  .slot.loaded{cursor:default;border-color:var(--pink)}
  .slot.loaded .n{color:var(--pink)}
  .slot.loaded .body{color:var(--ink);font-style:normal}
  .slot.loaded .body{animation:fade .4s ease both}
  .slots-foot{margin-top:36px;text-align:center;display:none}
  .slots-foot.on{display:block}

  /* ─── letter ─── */
  .paper{background:var(--paper);color:var(--paper-ink);border-radius:5px;padding:38px 26px 34px;box-shadow:0 34px 60px -24px rgba(0,0,0,.7);margin-top:4px}
  .paper p{font-size:18.5px;line-height:1.62;font-weight:300;margin:0 0 1.15em}
  .paper p:last-child{margin:0}
  .paper .sal{font-size:24px;font-weight:300;font-style:italic;margin-bottom:1.2em}
  .paper .sig{margin-top:1.6em;font-style:italic;font-weight:400}

  /* ─── end ─── */
  .names{flex:1;display:flex;flex-direction:column;justify-content:center;font-weight:300;font-size:clamp(28px,7.5vw,38px);line-height:1.35;letter-spacing:-.01em}
  .names span{display:block}
  .save{font-family:var(--pixel);font-size:12px;line-height:2;color:var(--amber);margin-top:40px}

  /* mute */
  #mute{position:fixed;right:14px;top:14px;width:42px;height:42px;border-radius:50%;background:var(--night-2);display:none;place-items:center;z-index:9;border:2px solid rgba(255,255,255,.08)}
  #mute.show{display:grid}
  #mute svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #mute .x{display:none}
  #mute.off .wave{display:none}
  #mute.off .x{display:block}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<button id="mute" aria-label="Mute music">
  <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="x" d="M17 9l4 6M21 9l-4 6"/></svg>
</button>
<audio id="bgm" loop preload="auto"></audio>

<main>

  <!-- 1 · envelope + countdown -->
  <section class="screen on" id="s-envelope">
    <div class="env-wrap">
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Sealed envelope">
        <div class="fold"></div>
        <div class="stamp" aria-hidden="true">
          <svg width="22" height="20" viewBox="0 0 11 10" shape-rendering="crispEdges"><path fill="#B8323C" d="M1 1h3v1H1zM7 1h3v1H7zM0 2h5v1H0zM6 2h5v1H6zM0 3h11v3H0zM1 6h9v1H1zM2 7h7v1H2zM3 8h5v1H3zM4 9h3v1H4z"/></svg>
        </div>
        <div class="flap"></div>
        <div class="seal" id="seal">A</div>
        <div class="to" id="to"></div>
      </div>
      <div class="count" id="count"></div>
    </div>
  </section>

  <!-- 2 · birthday side -->
  <section class="screen" id="s-greet">
    <h1 id="greet-title"></h1>
    <div class="lede" id="greet-lede"></div>
    <div class="photos" id="photos"></div>
    <div class="lede" id="greet-close"></div>
    <div class="foot">
      <button class="quiet" data-go="s-lock">Continue?<br>There's a second save.</button>
    </div>
  </section>

  <!-- 3 · lock -->
  <section class="screen" id="s-lock">
    <h2>Load save?</h2>
    <p class="lede" id="lock-hint"></p>
    <form class="lock-form" id="lock-form" autocomplete="off">
      <input id="pw" inputmode="numeric" placeholder="the date" aria-label="Password">
      <button class="btn" type="submit">Open</button>
      <div class="err" id="err" aria-live="polite"></div>
    </form>
    <div class="foot">
      <button class="quiet" data-go="s-greet">Back to your birthday</button>
    </div>
  </section>

  <!-- 4 · save slots -->
  <section class="screen" id="s-slots">
    <h2>Save data</h2>
    <p class="lede" style="margin-bottom:28px">Tap one to load it.</p>
    <div class="slots" id="slots"></div>
    <div class="slots-foot" id="slots-foot">
      <button class="btn" data-go="s-letter">Read the letter</button>
    </div>
    <div class="foot">
      <button class="quiet" data-go="s-letter">or skip ahead</button>
    </div>
  </section>

  <!-- 5 · letter -->
  <section class="screen" id="s-letter">
    <div class="paper" id="paper"></div>
    <div class="foot">
      <button class="btn" data-go="s-end">One more thing</button>
    </div>
  </section>

  <!-- 6 · end -->
  <section class="screen" id="s-end">
    <div class="names" id="names"></div>
    <div class="save" id="save-line"></div>
    <div class="foot">
      <button class="quiet" data-go="s-greet">Back to the start</button>
    </div>
  </section>

</main>

<script>
/* ════════════════════════════════════════════════════════════
   EVERYTHING YOU'D WANT TO EDIT IS IN THIS BLOCK.
   Photos: put the files in the same folder as this page.
   Music:  same folder, name it whatever you set below.
   Preview without waiting for midnight: open  index.html?preview
   ════════════════════════════════════════════════════════════ */
const CONFIG = {

  // Countdown target — her midnight, GMT+7.
  unlockAt: "2026-09-13T00:00:00+07:00",

  music: "music.mp3",
  musicVolume: 0.55,

  envelopeTo: "for Baby Angel",

  // ── Birthday side ──
  greetTitle: "Happy birthday, Mi Casa.",
  greetLede: [
    "It's your birthday and I'm not there, which is the one thing about today I'd fix if I could.",
    "So this is the next best thing. Scroll."
  ],
  photos: [
    { file: "photo-1.jpg", caption: "Write your caption here." },
    { file: "photo-2.jpg", caption: "Write your caption here." },
    { file: "photo-3.jpg", caption: "Write your caption here." }
  ],
  greetClose: [
    "Have the best day. Eat the McFlurry. Drink the ice lemon tea.",
    "I hope it's a good one, Angel."
  ],

  // ── The door ──
  lockHint: "This one's locked. The password is the night it started.",
  // digits only — she can type it with dots, dashes, spaces, whatever
  passwords: ["1111111", "11110111", "1111", "111111", "1111111111"],
  wrongMsg: "Not that one. Think of the date.",

  // ── Save slots ──
  slots: [
    "You fell asleep on call so many times that I stopped hanging up. I'd just leave it running until morning.",
    "Antarctica Expedition. You clearing the parkour like it's nothing while I'm still stuck on the second jump.",
    "\u201cCan you help with my assignment?\u201d Every time, usually near midnight. I said yes every time. I'd say yes again.",
    "McFlurry and ice lemon tea. One day I'm buying you both in person, and that's the whole plan.",
    "Serious on a call with your lecturer, then jedag jedug on TikTok ten minutes later, then a whole Chinese drama in a weekend. All of that is you. Nobody else gets to be all of that."
  ],

  // ── The letter ──
  letterSalutation: "Mi Casa,",
  letter: [
    "Happy birthday.",
    "I made this because I wanted you to have something today that was actually yours. Not a message in a chat that scrolls away \u2014 something that stays put.",
    "I keep thinking about the calls. You'd fall asleep somewhere in the middle and I'd just leave it running, because having the sound of you in the room was the closest we ever got to being in the same place. Your face when you're asleep is my favorite thing I've never seen in person.",
    "I've told you before that you have snake eyes. I stand by it. And somehow, depending on what you're about to say, they're also the cutest eyes I've ever seen. You can talk your way through any room, and then ask me to fix your assignment at midnight. You have a different voice for every mood and I know which one is coming before you use it. I never got bored of any of it. I never got bored of looking at you.",
    "I'm not going to use your birthday to ask you for anything. You don't owe me a reply to this, or to anything.",
    "But I'd rather say it plainly than make you guess: I love you. That hasn't changed and I'm not expecting it to. I'm still the biggest fan of yours in the entire universe. Whatever this is now \u2014 I'm glad it's you on the other end of the line.",
    "Happy birthday, Angel."
  ],
  signature: "\u2014 your player one",

  // ── Last screen ──
  names: ["Mi Casa.", "Mi Amor.", "Mi Favorito.", "The Angel.", "Baby Angel.", "The one and only."],
  saveLine: "I'd give you my save file."
};
/* ═══════════════════════ end of config ═══════════════════════ */

const $ = s => document.querySelector(s);
const preview = new URLSearchParams(location.search).has("preview");

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("#"+id).classList.add("on");
  window.scrollTo({top:0});
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));

/* fill text */
$("#to").textContent = CONFIG.envelopeTo;
$("#greet-title").textContent = CONFIG.greetTitle;
$("#greet-lede").innerHTML = CONFIG.greetLede.map(p => `<p>${p}</p>`).join("");
$("#greet-close").innerHTML = CONFIG.greetClose.map(p => `<p>${p}</p>`).join("");
$("#lock-hint").textContent = CONFIG.lockHint;
$("#paper").innerHTML =
  `<p class="sal">${CONFIG.letterSalutation}</p>` +
  CONFIG.letter.map(p => `<p>${p}</p>`).join("") +
  `<p class="sig">${CONFIG.signature}</p>`;
$("#names").innerHTML = CONFIG.names.map(n => `<span>${n}</span>`).join("");
$("#save-line").textContent = CONFIG.saveLine;

/* photos */
$("#photos").innerHTML = CONFIG.photos.map(p =>
  `<figure data-file="${p.file}"><img src="${p.file}" alt=""><figcaption>${p.caption}</figcaption></figure>`).join("");
document.querySelectorAll("#photos img").forEach(img => {
  img.addEventListener("error", () => img.parentElement.classList.add("missing"));
});

/* countdown + envelope */
const env = $("#envelope"), count = $("#count");
const target = new Date(CONFIG.unlockAt).getTime();
let unlocked = false, opened = false;
const pad = n => String(n).padStart(2,"0");

function tick(){
  const d = target - Date.now();
  if (preview || d <= 0){
    if (!unlocked){ unlocked = true; env.classList.add("unlocked"); }
    count.innerHTML = `<small>It's your birthday. Break the seal.</small>`;
    return;
  }
  const s = Math.floor(d/1000);
  const days = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sec = s%60;
  count.innerHTML = `${days>0 ? days+"d " : ""}${pad(h)}h ${pad(m)}m ${pad(sec)}s<small>Sealed until midnight.</small>`;
}
tick(); setInterval(tick, 1000);

function openEnvelope(){
  if (!unlocked || opened) return;
  opened = true;
  env.classList.add("open");
  startMusic();
  setTimeout(() => show("s-greet"), 1100);
}
env.addEventListener("click", openEnvelope);
env.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnvelope(); }});

/* music */
const bgm = $("#bgm"), mute = $("#mute");
bgm.src = CONFIG.music;
bgm.volume = CONFIG.musicVolume;
let musicOn = false;
function startMusic(){
  bgm.play().then(() => { musicOn = true; mute.classList.add("show"); }).catch(() => { mute.classList.add("show"); mute.classList.add("off"); });
}
mute.addEventListener("click", () => {
  if (bgm.paused){ bgm.play().catch(()=>{}); mute.classList.remove("off"); mute.setAttribute("aria-label","Mute music"); }
  else { bgm.pause(); mute.classList.add("off"); mute.setAttribute("aria-label","Play music"); }
});

/* lock */
$("#lock-form").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("#pw"), typed = input.value.replace(/\D/g,"");
  if (CONFIG.passwords.includes(typed)){
    $("#err").textContent = "";
    show("s-slots");
  } else {
    $("#err").textContent = CONFIG.wrongMsg;
    input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
    input.select();
  }
});

/* save slots */
let loaded = 0;
$("#slots").innerHTML = CONFIG.slots.map((t,i) =>
  `<button class="slot" data-i="${i}"><span class="n">Slot ${i+1}</span><span class="body">Empty. Tap to load.</span></button>`).join("");
document.querySelectorAll(".slot").forEach(b => {
  b.addEventListener("click", () => {
    if (b.classList.contains("loaded")) return;
    b.classList.add("loaded");
    b.querySelector(".body").textContent = CONFIG.slots[b.dataset.i];
    if (++loaded === CONFIG.slots.length) $("#slots-foot").classList.add("on");
  });
});
</script>
</body>
</html>
